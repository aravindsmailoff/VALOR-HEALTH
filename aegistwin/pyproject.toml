[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegistwin"
version = "1.0.0"
description = "AegisTwin: Stateful Member Digital Twin, Multi-Outcome Predictive Risk Stratification & Clinical Decision Support"
authors = [{ name = "Principal Healthcare AI Architect" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
ml = [
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
]
demo = [
    "streamlit>=1.28.0",
    "plotly>=5.17.0",
]
dev = [
    "pytest>=7.4.0",
]

[tool.setuptools]
package-dir = {"aegistwin" = "."}
packages = [
    "aegistwin",
    "aegistwin.app",
    "aegistwin.compliance",
    "aegistwin.config",
    "aegistwin.data",
    "aegistwin.evaluation",
    "aegistwin.llm_brief",
    "aegistwin.models",
    "aegistwin.monitoring",
    "aegistwin.safety",
    "aegistwin.serving",
    "aegistwin.triage",
    "aegistwin.twin",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["..", "."]
